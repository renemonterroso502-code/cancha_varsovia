<!-- CONTENIDO -->

<div class="content">



<nav class="navbar bg-white shadow-sm">


<div class="container-fluid">


<h4>

Control de Reservas

</h4>


</div>


</nav>





<div class="container-fluid mt-4">



<!-- RESUMEN -->


<div class="row g-4 mb-4">


<div class="col-md-4">

<div class="card dashboard-card">

<div class="card-body">

<i class="fa-solid fa-clock icon"></i>

<h5>
Pendientes
</h5>

<h2 id="totalPendientes">
0
</h2>

<p class="text-muted">
Por confirmar
</p>

</div>

</div>

</div>



<div class="col-md-4">

<div class="card dashboard-card">

<div class="card-body">

<i class="fa-solid fa-circle-check icon"></i>

<h5>
Confirmadas
</h5>

<h2 id="totalConfirmadas">
0
</h2>

<p class="text-muted">
Listas para jugar
</p>

</div>

</div>

</div>



<div class="col-md-4">

<div class="card dashboard-card">

<div class="card-body">

<i class="fa-solid fa-calendar-day icon"></i>

<h5>
Hoy
</h5>

<h2 id="totalHoy">
0
</h2>

<p class="text-muted">
Reservas para hoy
</p>

</div>

</div>

</div>


</div>





<div class="card shadow">


<div class="card-body">



<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">


<h4 class="mb-0">

<i class="fa-solid fa-calendar-check"></i>

Reservas

</h4>



<div class="d-flex gap-2 flex-wrap">


<select id="filtroEstado" class="form-select">

<option value="todos">
Todos los estados
</option>

<option value="Pendiente">
Pendientes
</option>

<option value="Confirmada">
Confirmadas
</option>

<option value="Cancelada">
Canceladas
</option>

</select>



<input
type="date"
id="filtroFecha"
class="form-control">



<input 
type="text"
id="buscarReserva"
class="form-control"
style="min-width:220px"
placeholder="Buscar por cliente...">


</div>


</div>






<div class="table-responsive">



<table class="table table-hover align-middle">



<thead>


<tr>


<th>
Cliente
</th>


<th>
Contacto
</th>


<th>
Fecha
</th>


<th>
Horario
</th>


<th>
Total
</th>


<th>
Estado
</th>


<th>
Acciones
</th>


</tr>


</thead>




<tbody id="tablaReservas">


</tbody>



</table>



</div>






</div>


</div>



</div>



</div>
